# One-off helper: take the artifacts of a build run and attach them to release v1.0.0.
# Created because a workflow_dispatch build (no tag) does not publish to the release.
# Uses the gh CLI because actions/download-artifact can only download artifacts
# from a run of the SAME workflow, not from the build workflow's run.
# Every gh command passes --repo explicitly because this job does not check out
# the repository, so gh cannot resolve the repo from a local .git directory.
# The macOS download is allowed to fail (macOS runners are capacity-constrained), so
# the Linux files can be attached while the macOS build is still pending.
# Only top-level FILES are uploaded: electron-builder's dist/ also contains the
# unpacked app directory (linux-unpacked/ or mac-arm64/), which is not a release file.
# builder-debug.yml is skipped: it exists in both dist/ folders with the same name,
# and gh release upload --clobber cannot delete the same asset name twice in one run
# (it 404s on the stale asset id and then the remaining files never upload).
# Files are uploaded one by one, each replacing any existing same-named asset via
# a fresh id lookup, so one failure cannot strand the others.
# Delete this file once the v1.0.0 release has the macOS + Linux files.
name: Attach v1.0.0 release assets

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose artifacts to attach"
        required: true
        default: "42064440527"
        type: string

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.run_id }}" --repo manamaliahmad/redcat --name redcat-macos --dir macos || echo "macOS artifact not available yet"
          gh run download "${{ inputs.run_id }}" --repo manamaliahmad/redcat --name redcat-linux --dir linux
          echo '--- downloaded files ---'
          if [ -d macos ]; then find macos -type f | sort; fi
          find linux -type f | sort
      - name: Upload to release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 --repo manamaliahmad/redcat --json tagName --jq .tagName
          mapfile -t files < <(find linux macos -maxdepth 1 -type f ! -name 'builder-debug.yml' 2>/dev/null | sort)
          if [ "${#files[@]}" -eq 0 ]; then echo "No files to upload"; exit 1; fi
          failed=0
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            existing="$(gh release view v1.0.0 --repo manamaliahmad/redcat --json assets --jq --arg n "$name" '.assets[] | select(.name == $n) | .id' | head -n 1 || true)"
            if [ -n "$existing" ]; then
              echo "Removing old asset $name (id $existing)"
              gh release delete-asset --repo manamaliahmad/redcat "$existing" -y || echo "warning: could not delete old $name"
            fi
            echo "Uploading $f ..."
            gh release upload v1.0.0 "$f" --repo manamaliahmad/redcat || { echo "FAILED to upload $f"; failed=1; }
          done
          echo '--- release assets ---'
          gh release view v1.0.0 --repo manamaliahmad/redcat --json assets --jq '.assets[] | .name + " (" + (.size | tostring) + " bytes)"'
          exit "$failed"
