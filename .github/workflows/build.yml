# RedCat desktop apps — build macOS + Linux on GitHub Actions.
# Windows is built on the PC (npm run dist-win).
# Trigger: manually (Actions tab -> Run workflow) or when a v* tag is pushed.
# Each job uploads its built files as an artifact; attach them to the
# GitHub release (v1.0.0) from the Actions run's Artifacts section.
name: Build macOS and Linux apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build macOS app
        run: npm run dist-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: redcat-macos
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build Linux app
        run: npm run dist-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: redcat-linux
          path: dist/
          if-no-files-found: error
