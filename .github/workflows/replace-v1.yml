name: Replace main with v1.0.0 payload
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace tree with payload contents
        run: |
          set -euo pipefail
          test -f payload.zip || { echo "payload.zip missing"; exit 1; }
          unzip -l payload.zip | grep -q 'payload/main.js' || { echo "payload/main.js not found in zip"; exit 1; }
          unzip -l payload.zip | grep -q 'payload/package.json' || { echo "payload/package.json not found"; exit 1; }
          unzip -l payload.zip | grep -q 'payload/README.md' || { echo "payload/README.md not found"; exit 1; }
          unzip -l payload.zip | grep -q 'payload/.github/workflows/build.yml' || { echo "payload build.yml not found"; exit 1; }
          COUNT=$(unzip -l payload.zip | grep -c '^ *[0-9]')
          echo "payload entries: $COUNT"
          test "$COUNT" -ge 250 || { echo "too few files in payload: $COUNT"; exit 1; }
          rm -rf /tmp/payload
          mkdir -p /tmp/payload
          unzip -q payload.zip -d /tmp/payload
          ls /tmp/payload/payload
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/payload/payload/. .
          echo "--- top level ---"
          ls -la
          echo "--- total files ---"
          find . -type f -not -path './.git/*' | wc -l
          test -f main.js
          test -f package.json
          test -f README.md
          test -f CONTRIBUTING.md
          test -f LICENSE
          test -f .gitignore
          test -d redcat-app
          test -d discord-gateway
          test -f .github/workflows/build.yml
          test ! -e src-tauri
          test ! -e payload.zip
          test ! -e ARCHITECTURE.md
          git add -A
          git status --short | head -n 20
          git config user.name "manamaliahmad"
          git config user.email "manamaliahmad@users.noreply.github.com"
          git commit -m "RedCat v1.0.0: replace Tauri app with Electron app" -m "Removes all old Tauri/Rust code. Old releases remain preserved under tags v0.3.0 and v0.3.1."
          git push origin main
