<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discord connected — RedCat</title>
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f6f7; color: #111827; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: #ffffff; border-radius: 16px; padding: 36px 40px; max-width: 440px; width: calc(100% - 48px); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.12); text-align: center; }
  .logo { width: 64px; height: 64px; object-fit: contain; margin-bottom: 8px; }
  h1 { font-size: 22px; margin: 8px 0 10px 0; }
  p { font-size: 14.5px; line-height: 1.55; color: #4b5563; margin: 0 0 20px 0; }
  .btn { display: inline-block; background: #dc2626; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; padding: 12px 26px; border-radius: 10px; }
  .btn:hover { background: #b91c1c; }
  .note { font-size: 12.5px; color: #9ca3af; margin: 18px 0 0 0; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/redcatlogo.png" alt="RedCat">
    <h1>Discord connected</h1>
    <p>RedCat is now connected to Discord. Your Discord chats will show in the RedCat app, in the Discord section below Main chat.</p>
    <a class="btn" href="/">Open RedCat app</a>
    <p class="note">If the app does not open, make sure RedCat is running on your PC, then open http://127.0.0.1:3000/ in your browser.</p>
  </div>
</body>
</html>
