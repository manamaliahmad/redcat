<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REDCAT Expo Go QR Code</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    body {
      background: #0f1015;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #181a24;
      border: 1px solid rgba(247, 36, 69, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px rgba(247, 36, 69, 0.15);
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px;
      color: #fff;
    }
    h1 span {
      color: #F72445;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin: 0 0 24px;
    }
    .qr-box {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .url-box {
      background: #0d0e12;
      border: 1px solid #2a2d3d;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: monospace;
      font-size: 14px;
      color: #F72445;
      word-break: break-all;
      user-select: all;
      cursor: pointer;
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>REDCAT <span>Expo Go</span></h1>
    <p>Apne mobile se Expo Go khol kar yeh QR scan karein:</p>
    <div class="qr-box">
      <div id="qrcode"></div>
    </div>
    <div class="url-box" id="urlText" title="Click to copy">exp://192.168.100.10:8081</div>
    <div class="hint">Ya Expo Go app mein "Enter URL manually" dabayein aur upar wala link paste karein.</div>
  </div>

  <script>
    const expUrl = "exp://192.168.100.10:8081";
    new QRCode(document.getElementById("qrcode"), {
      text: expUrl,
      width: 220,
      height: 220,
      colorDark : "#111111",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.M
    });

    document.getElementById("urlText").addEventListener("click", () => {
      navigator.clipboard.writeText(expUrl);
      alert("URL copied: " + expUrl);
    });
  </script>
</body>
</html>
