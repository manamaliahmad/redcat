[package]
authors = ["RedCat Contributors"]
description = "RedCat — your desktop cat that actually works. Local-first, BYOK, open source."
edition = "2021"
name = "redcat"
version = "0.3.1"

[build-dependencies]
tauri-build = "2"

[dependencies]
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { features = ["derive"], version = "1" }
serde_json = "1"
sha2 = "0.10"
tauri = { features = ["tray-icon"], version = "2" }
tokio = { features = ["macros", "rt-multi-thread"], version = "1" }
wait-timeout = "0.2"
